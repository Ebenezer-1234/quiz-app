<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Applicatin</title>
    <!--import my css file-->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="quiz-card" class="quiz-card">
      <!--progrss Indicator-->
      <div class="quiz-header">
        <span id="progress-text">loading questions </span>
        <div class="progress-bar">
          <div id="progress-fill"></div>
        </div>
      </div>
      <!--questions container-->
      <div id="quiz-body">
        <h2 id="question-title">Loading Question...</h2>
        <div id="opyions-container" class="options-grid"></div>
      </div>

      <!--result screen {HIDDEN Initially}-->
      <div id="result-screen" class="hidden">
        <h2>Quiz Completed!</h2>
        <p id="score-text">you score 0 out of 0</p>
        <button id="restart-btn">Try Again</button>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
